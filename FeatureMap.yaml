- id: 0919-1629-index-parameter-im-frontend-anpa
  name: Index-Parameter im Frontend anpassen, Vorschau/Speichern, Indizes anlegen und löschen
  status: umgesetzt
  beschreibung: 'Pro Index sollen die Parameter (Keywords, Tags/Kategorien, Mindestliquidität,
    Preis-Korridor) direkt im Dashboard anpassbar sein. Änderungen wirken zunächst nur als
    Vorschau (temporär ausprobieren, DB unverändert) und können auf Wunsch dauerhaft gespeichert
    werden. Zusätzlich sollen neue Indizes angelegt und bestehende gelöscht werden können.

    Beschlossener Umfang:

    - Neue Endpoints: Vorschau (Regel im Request-Body, berechnet Index-Wert, Trichter und
    Märkte ohne zu speichern), PUT /indices/{name} (Regel speichern), POST /indices (Index
    anlegen), DELETE /indices/{name} (Index löschen). Validierung: Name eindeutig, min_liquidity
    >= 10 000 USD, 0 <= min_price < max_price <= 1.

    - Dashboard: aufklappbares Panel "Parameter" pro Index mit Keyword-Chips (hinzufügen/entfernen),
    Tag-Mehrfachauswahl (Liste aus den tatsächlich gelieferten Tags der Grundgesamtheit),
    Eingaben für Mindestliquidität (Hinweis: mindestens 10 000 USD) und Preis-Korridor.

    - Jede Änderung im Panel löst sofort eine Vorschau aus: Kopfzeile, Trichter und Tabelle
    aktualisieren sich; die gespeicherte Regel bleibt unverändert. Markierung "ungespeicherte
    Änderungen".

    - Knöpfe "Dauerhaft speichern" (PUT, Markierung verschwindet) und "Verwerfen" (zurück
    zur gespeicherten Regel).

    - Knopf "Neuer Index": Name plus Parameter, wird nach Anlegen ausgewählt. Knopf "Index
    löschen" mit Rückfrage; danach wird der erste verbleibende Index ausgewählt.

    - Bestehende Funktionalität (Index-Auswahl, Tabelle, Quellenfilter, Titelfilter, Aktualisieren)
    bleibt erhalten.'
  kriterien:
  - Vorschau-Endpoint liefert dieselbe Antwortstruktur wie GET /indices/{name}, ohne die Regel
    in der DB zu verändern.
  - PUT/POST/DELETE funktionieren mit Validierung (400 bei ungültigen Werten, 404 bei unbekanntem
    Index, 409 bei doppeltem Namen).
  - Panel zeigt die gespeicherten Parameter, Änderungen lösen eine Vorschau aus, Markierung
    für ungespeicherte Änderungen sichtbar.
  - Speichern persistiert; nach Neuladen der Seite sind die Werte vorhanden. Verwerfen stellt
    die gespeicherte Regel wieder her.
  - Index anlegen und löschen funktionieren aus dem Dashboard; gelöschte Indizes kehren nach
    Neustart nicht zurück.
  - Alle Dateien unter 500 Zeilen; Changelog.md und Requirements.log aktualisiert.
  tests:
  - backend/tests/test_index_params.py
  gruppe: grp-0919-1629-30c2
  rang: 2
- id: 0918-2056-preiskorridor-und-enddatum-in-au
  name: Preiskorridor und Enddatum in Aufnahmeregel
  status: umgesetzt
  beschreibung: 'Konsequenz für den Index: Die Aufnahmeregel filtert nicht nur auf Liquidity
    und `volume24hr`, sondern zusätzlich auf einen Preiskorridor (etwa 0.03 bis 0.97) und
    ein Enddatum in der Zukunft. Ein Markt nahe 0 oder 1 trägt keine Information mehr, egal
    wie hoch sein Volume ist. So fallen LeBron-Märkte heraus, ohne dass echte Politikmärkte
    mit starkem Konsens verloren gehen.


    <br />

    '
  tests:
  - backend/tests/test_engine.py
  - backend/tests/test_clients.py
  - backend/tests/test_migration.py
  - backend/tests/test_api.py
