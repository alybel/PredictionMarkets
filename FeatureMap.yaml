- id: 1015-2120-staging-und-raw-layer-mit-idempo
  name: Staging- und Raw-Layer mit Idempotenz (Fed-Zinsketten)
  status: umgesetzt
  beschreibung: 'Abruf schreibt API-Antworten unverändert nach data/staging/<quelle>/<datensatz>/<datum>/
    inkl. Abrufzeit und URL. Dateien werden nie überschrieben, identischer Inhalt zur letzten
    Datei wird nicht erneut geschrieben.

    Staging -> Raw lädt neue Dateien 1:1 in Raw-Tabellen (Inhalt, Quelle, Datensatz, Abrufzeit,
    Prüfsumme) und führt ein Ladeprotokoll.

    Eindeutigkeitsregeln liegen in der DB (Migration). Einfügen überspringt Vorhandenes still,
    pro Datei gilt alles oder nichts.

    Fehlerhafte Staging-Dateien werden protokolliert und übersprungen.

    Beide Schritte als getrennte CLI-Befehle. data/ wird in .gitignore eingetragen.


    (Teil 2/3 von „Staging-Ordner und idempotenter Raw-Layer in SQLite (Pilot: Fed-Zinsketten)“,
    1015-2119-staging-ordner-und-idempotenter)

    Alle Teile in Reihenfolge:

    1. Schema-Auto-Migration, Fehler-Logging und /health

    2. Staging- und Raw-Layer mit Idempotenz (Fed-Zinsketten) ← dieses Ticket

    3. Frontend-Buttons und Fehleranzeige (Fed-Zinsketten)

    Setze NUR diesen Teil um und greife späteren Teilen nicht vor.'
  kriterien:
  - Abruf schreibt Antworten unverändert nach data/staging/<quelle>/<datensatz>/<datum>/ und
    überschreibt nie eine Datei
  - Identischer Abruf erzeugt keine zweite Datei, geänderter Inhalt erzeugt eine neue
  - data/ ist in .gitignore eingetragen
  - Ladeschritt bringt neue Staging-Dateien 1:1 in die Raw-Tabellen, ein zweiter Lauf lädt
    0 Dateien
  - Raw-Tabellen und Ladeprotokoll haben Eindeutigkeitsregeln in der DB (Migration vorhanden)
  - Wiederholte und parallele Läufe ergeben denselben Datenbestand ohne Duplikate
  - Abbruch mitten im Lauf hinterlässt keine halben Daten, der nächste Lauf setzt fort
  - Fehlerhafte Datei wird protokolliert und übersprungen, der Lauf läuft weiter
  - Jeder Lauf loggt gefunden / neu / übersprungen / fehlgeschlagen
  - Bestehende Fed-Sicht (Abdeckung, Ketten, Prüfungen) und alle Tests bleiben grün
  tests:
  - 'Abruf mit Fixture zweimal: eine Staging-Datei, Inhalt unverändert'
  - 'Abruf mit geändertem Inhalt: zweite Datei entsteht, erste bleibt unverändert'
  - 'Ladeschritt zweimal: beim zweiten Lauf 0 neue Zeilen'
  - Doppeltes Einfügen derselben Prüfsumme wird von der DB abgewiesen bzw. übersprungen
  - 'Abbruch mitten in einer Datei: keine Teilzeilen in der Raw-Tabelle'
  - 'Zwei parallele Ladeläufe: Datenbestand identisch, keine Duplikate'
  - 'Kaputte Staging-Datei: Protokolleintrag, übrige Dateien werden geladen'
  testdateien:
