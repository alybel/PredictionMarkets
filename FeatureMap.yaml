- id: 1015-2043-fed-zinsketten-raw-layer-erwarte
  name: 'Fed-Zinsketten: Raw-Layer, erwartete Zinsänderung als Front- und Zweitkette, Sicht
    in Datenqualität'
  status: umgesetzt
  beschreibung: 'Ziel: Zinsindex aus Prognosemärkten mit möglichst langer, sauberer Historie.
    Bestehende Indizes, Backfill, Korrelation und Datenqualitäts-Ansichten bleiben unverändert.


    1. Raw-Layer (eigene Tabellen, getrennt von eui_market_snapshots):

    - Alle Fed-Entscheidungsmärkte (FOMC) von Kalshi und Polymarket laden, auch abgeschlossene,
    so weit zurück wie die APIs Kurse liefern.

    - Pro Markt: Quelle, externe ID, Sitzungsdatum, Ausgang als Zinsschritt in bp (z. B. -50,
    -25, 0, +25), Titel, Link.

    - Pro Tag und Ausgang: Preis, Umsatz (falls verfügbar), Abrufzeitpunkt, Herkunft (live/historisch).

    - Append-only: Rohdaten werden nie überschrieben; erneuter Lauf lädt nur Fehlendes nach
    (idempotent).

    - Point-in-time-Regel wie bisher (quality.pit): kein Tageswert nach US-Börsenschluss des
    jeweiligen Tages.

    - Startbar per CLI und Endpoint; ein fehlerhafter Markt stoppt den Lauf nicht.


    2. Abgeleitete Metrik (Datenebene, aus dem Raw-Layer berechnet):

    - Pro Sitzung und Tag: Wahrscheinlichkeiten der Ausgänge auf 100 % normieren; erwartete
    Zinsänderung = Summe(Wahrscheinlichkeit × bp).

    - Wahrscheinlichkeitssumme vor Normierung mitspeichern (Qualitätsmerkmal).

    - Reihen getrennt für Kalshi, Polymarket und kombiniert (Mittelwert, wenn beide vorhanden).

    - Zwei Ketten: Front-Kette = jeweils nächste anstehende Sitzung; Zweitkette = jeweils
    übernächste Sitzung.

    - Nach jeder Entscheidung rollen beide Ketten eine Sitzung weiter (bisherige Zweit-Sitzung
    wird Front).

    - Am Roll-Tag wird die Tagesänderung nur innerhalb desselben Marktes gemessen (Kettenverknüpfung),
    der Wechsel erzeugt keinen Sprung.


    3. Sicht im Tab "Datenqualität" (neuer Abschnitt "Fed-Zinsketten"):

    - Abdeckung: Zeitbalken pro Sitzung und Quelle, Lücken markiert.

    - Kettenverlauf: Chart von Front- und Zweitkette je Quelle, Roll-Tage markiert.

    - Prüfungen: Wahrscheinlichkeitssumme deutlich ungleich 100 %, fehlende Tage, Abweichung
    Kalshi vs. Polymarket, Tagessprünge, Werte nach Börsenschluss.

    - Drill-down: Klick auf einen Tag zeigt die Rohwerte je Ausgang, aus denen der Wert entstand.


    4. Logging: Laden (Start, Ende, Anzahl Märkte/Zeilen, Fehler je Markt), Berechnung, Roll-Ereignisse,
    Prüfergebnisse sowie alle Klicks und Eingaben in der neuen Sicht.


    Nicht enthalten: Anbindung an die Aktienkorrelation (Folgeticket, sobald die Datenqualität
    überzeugt).'
  kriterien:
  - Raw-Tabellen existieren per Alembic-Migration und enthalten Fed-Märkte beider Quellen
    inklusive abgeschlossener Sitzungen.
  - Zweiter Ladelauf ohne neue Daten fügt 0 Zeilen hinzu und ändert keine bestehende Zeile.
  - Keine Raw-Zeile hat einen Beobachtungszeitpunkt nach dem US-Börsenschluss ihres Tages.
  - Für jeden Tag mit Daten liegen erwartete Zinsänderung, Rohsumme der Wahrscheinlichkeiten
    und Quelle je Sitzung vor.
  - Front- und Zweitkette sind für jeden Tag mit Daten berechnet; Roll-Tage sind gekennzeichnet.
  - Am Roll-Tag entspricht die Tagesänderung der Kette der Änderung des neuen Front-Marktes
    gegenüber seinem eigenen Vortageswert.
  - Tab "Datenqualität" zeigt Abdeckung, Kettenverlauf beider Ketten, Prüfungen und Drill-down
    auf Rohwerte.
  - Bestehende Indizes, Backfill, Korrelation und bisherige Datenqualitäts-Ansichten funktionieren
    unverändert (bestehende Tests grün).
  - Logging für Laden, Berechnung, Rollen, Prüfungen und UI-Klicks ist vorhanden.
  - Alle Dateien unter 500 Zeilen; Changelog.md und Requirements.log sind aktualisiert.
  tests:
  - 'Parser Kalshi: Fed-Markt-Antwort (Fixture) wird korrekt in Sitzungsdatum, Ausgang in
    bp und Tagespreise zerlegt.'
  - 'Parser Polymarket: Fed-Event mit mehreren Ausgängen (Fixture) wird korrekt in Ausgänge
    mit bp und Tagespreise zerlegt.'
  - 'Idempotenz: zweiter Ladelauf mit denselben Fixture-Daten fügt keine Zeilen hinzu und
    überschreibt nichts.'
  - 'Point-in-time: Kurspunkt nach US-Börsenschluss wird verworfen.'
  - 'Fehlertoleranz: ein Markt mit fehlerhafter Antwort wird geloggt und übersprungen, die
    übrigen werden geladen.'
  - 'Erwartete Zinsänderung: 70 % 0 bp, 25 % -25 bp, 5 % -50 bp ergibt -8,75 bp.'
  - 'Normierung: Rohsumme 108 % wird auf 100 % normiert und die Rohsumme 1,08 gespeichert.'
  - 'Kombinierte Reihe: Mittelwert aus Kalshi und Polymarket, nur eine Quelle vorhanden ergibt
    deren Wert.'
  - 'Front-Kette: vor Sitzung A zeigt sie A, nach der Entscheidung von A zeigt sie B.'
  - 'Zweitkette: vor Sitzung A zeigt sie B, nach der Entscheidung von A zeigt sie C.'
  - 'Roll-Tag: Tagesänderung wird innerhalb des neuen Marktes gemessen, kein Sprung durch
    den Wechsel.'
  - 'Prüfungen: Wahrscheinlichkeitssumme außerhalb der Toleranz, fehlender Tag, Quellenabweichung
    und Tagessprung werden jeweils gemeldet.'
  - 'API Datenqualität: Endpoints für Abdeckung, Kettenverlauf und Drill-down liefern die
    erwartete Struktur.'
  - 'Regression: bestehende Endpoints für Indizes, Historie, Korrelation und Datenqualität
    liefern unverändert.'
  testdateien:
  - backend/tests/test_fed_raw_layer.py
  - backend/tests/test_fed_chains.py
