- id: 1015-2119-staging-ordner-und-idempotenter
  name: 'Staging-Ordner und idempotenter Raw-Layer in SQLite (Pilot: Fed-Zinsketten)'
  status: abgeloest
  beschreibung: 'Auslöser: Beim Nachladen der Fed-Zinsketten scheitern alle 295 Märkte und
    /quality/fed/coverage liefert HTTP 500. Ursache laut app.log: In backend/dev.db fehlen
    fed_markets/fed_prices (Migration 0009 nie ausgeführt, kein automatisches Schema-Update).
    Der 500er erscheint nicht in app.log, weil unbehandelte Exceptions an der Request-Logging-Middleware
    vorbeilaufen. Der Loader ruft 173 s lang das Netz ab, bevor er beim Speichern scheitert.

    Neuer Aufbau der Datenladung, als Pilot für die Fed-Zinsketten (Kalshi + Polymarket):

    1. Abrufen -> Staging: API-Antworten werden unverändert als Dateien unter data/staging/<quelle>/<datensatz>/<datum>/
    abgelegt (inkl. Abrufzeitpunkt und URL). Dateien sind unveränderlich, werden nie überschrieben.
    Identischer Inhalt zur letzten Datei derselben Anfrage wird nicht erneut geschrieben.
    data/ ist gitignored.

    2. Staging -> Raw: Neue Staging-Dateien werden unverändert in Raw-Tabellen der lokalen
    SQLite-DB geladen (Inhalt, Quelle, Datensatz, Abrufzeit, Prüfsumme). Ein Ladeprotokoll
    hält fest, welche Dateien geladen sind.

    3. Idempotenz ist Kernanforderung: Unsere Ladeprozesse dürfen nie Duplikate in der DB
    erzeugen. Absicherung über Eindeutigkeitsregeln in der DB selbst (nicht nur Code-Prüfung),
    Einfügen überspringt Vorhandenes still. Identischer Inhalt wird einmal gespeichert (mit
    Zeitpunkt des ersten Abrufs), geänderter Inhalt ist eine neue Beobachtung und wird gespeichert.

    4. Beide Schritte getrennt als CLI-Befehl und als Button im Bereich Fed-Zinsketten; Schema
    wird vor dem Laden automatisch auf head migriert (auch in start_dev.sh vor dem Serverstart).

    5. Logging-Lücke schließen: Unbehandelte Fehler mit Status 500 und Traceback in app.log;
    API loggt beim Start den Schema-Stand, /health meldet veraltetes Schema; Frontend zeigt
    die Fehlermeldung des Servers statt nur "HTTP 500".

    Bestehende Tabellen fed_markets/fed_prices und die Fed-Sicht bleiben erhalten; deren Befüllung
    aus dem Raw-Layer sowie weitere Quellen (EUI-Snapshots, Aktienkurse, Backfill, Probe)
    und eine Spiegelung nach Neon sind eigene Folge-Tickets.'
  kriterien:
