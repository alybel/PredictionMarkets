- id: disc-1016-1957-agent-umsetzung-innerhalb-der-pl
  name: Agent-Umsetzung innerhalb der Plattform klären
  thema: wie setzt der KI Agent das um innerhalb der Plattform?
  model: Standard
  thinking: standard
  erstellt: 2026-10-16 19:57
  bild: .devconsole/discussions/0B788BAF-A795-44AF-9E3C-DF9E3C572074.png
  archiviert: 2026-10-16 20:13
  ergebnis: 'Ins Ticket übernommen: KI-Agent Schritt 2 – fehlende Metriken anlegen (ausführbare
    Ketten-Regeln) (1016-2013-ki-agent-schritt-2-fehlende-metr)

    Der KI-Agent hilft im zweiten, getrennten Schritt, fehlende Metriken aus den Domänen-Rohdaten
    anzulegen.

    - Eingang: nicht abgedeckte Aspekte aus Schritt 1 oder direkte Idee.

    - Der Agent sucht nur in Domänen-Rohdaten (volle Historie) und schlägt Metriken vor: Einzelmarkt
    oder Kette, mit Regeln ausschließlich aus einem festen, ausführbaren Regelkatalog (Richtung
    steigend/fallend = 1 − p, Roll am Enddatum, Front-Kette bei parallelen Gliedern / konstante
    Restlaufzeit, Lücken nicht auffüllen, Ablauf ohne Vorwärtsauffüllen).

    - Freitext-Regeln des Modells werden nicht ausgeführt, sondern sichtbar als „Hinweis,
    nicht automatisch umgesetzt“ angezeigt.

    - Vor dem Vorschlag prüft der Agent Historie (≥ 180 Handelstage, Lücken) und Liquidität;
    Ergebnis steht am Vorschlag.

    - Liegt die Idee in keiner Domäne, sagt der Agent das und schlägt eine neue Domäne vor
    statt mit dünnen Daten weiterzuarbeiten.

    - „Als Metrik-Entwurf übernehmen“ speichert die Metrik STRUKTURIERT (Glieder mit Roll-Tag,
    Richtung, Regeln) statt nur als Text; Status startet als draft, bestehende Prüfungen laufen,
    Freigabe bleibt manuell.

    - Neue Rechenart für Ketten-Metriken, die die Regeln wirklich ausführt: je Tag nur das
    aktive Glied, Tagesänderung nur innerhalb eines Glieds (kein Sprung am Roll-Tag), Richtung
    gedreht, Lücken offen. Wiederverwendung der Ketten-Logik der Fed-Zinsketten. Ausgabe als
    Wahrscheinlichkeitsniveau des aktiven Glieds plus verkettete Reihe.

    - Modell: Sonnet. Jede Referenz wird gegen die Rohdaten validiert.

    - Bestehende Markt-Korb-Metriken (#45) bleiben unverändert erhalten und rechnen wie bisher
    (keine Funktion wird entfernt). Hinweis Requirements.log: berührt #45 und #53 – vor Umsetzung
    klären.

    - Logging: Vorschläge, verworfene Referenzen, Übernahme-Klicks, Rechenläufe je Ketten-Metrik.

    Definition of Done:

    - Im Modus „Metriken anlegen“ schlägt der Agent Einzelmärkte und Ketten aus Domänen-Rohdaten
    mit Regeln aus dem festen Katalog vor.

    - Jeder Vorschlag zeigt Historienlänge, Lücken und Liquidität; unter 180 Handelstagen
    mit Warnhinweis.

    - Freitext-Regeln erscheinen als „Hinweis, nicht automatisch umgesetzt“ und beeinflussen
    die Rechnung nicht.

    - Ohne passende Domäne meldet der Agent das und schlägt eine Domäne vor.

    - Übernommene Ketten-Metriken werden strukturiert gespeichert, starten als draft und durchlaufen
    die Prüfungen.

    - Die Ketten-Rechnung zeigt am Roll-Tag keinen Sprung, fallende Glieder gehen als 1 −
    p ein, Lücken bleiben leer.

    - Bestehende Korb-Metriken liefern unveränderte Werte.

    - Vorschläge und Übernahmen stehen im app.log; Changelog.md und Requirements.log sind
    ergänzt.

    Testumfang:

    - Ketten-Rechnung: zwei Glieder mit Roll-Tag → verkettete Reihe ohne Sprung am Roll-Tag.

    - Parallele Glieder: je Tag wird das nächstfällige Glied verwendet (Front-Kette).

    - Richtung fallend: Preis 0,3 geht als 0,7 ein.

    - Lücke zwischen Gliedern: keine Werte an Lückentagen, kein Vorwärtsauffüllen.

    - Validierung: Vorschlag mit unbekannter Referenz oder Regel außerhalb des Katalogs →
    verworfen bzw. als Hinweis geführt, Warnung geloggt.

    - Übernahme: strukturierte Speicherung, Status draft, Prüfungen laufen.

    - Regression: bestehende Korb-Metrik liefert dieselben Werte wie vorher.

    - Agent mit Fake (keine echten LLM-Aufrufe), Quellabrufe gemockt.'
- id: disc-1015-2227-regression-index-und-bestandteil
  name: 'Regression: Index und Bestandteile als Regressoren fehlt'
  thema: 'great. Now we lost the capability to regress the information (index and its constitents
    daily changes as regressors) to the next day stock returns. '
  model: Standard
  thinking: standard
  erstellt: 2026-10-15 22:27
  bild: .devconsole/discussions/1168A676-226E-4EC6-81F0-2B3DA3576A8E.png
  archiviert: 2026-10-15 22:31
  ergebnis: 'Ins Ticket übernommen: Regression Index und Bestandteile → Aktienrendite am nächsten
    Tag für Metrik-Indizes (1015-2231-regression-index-und-bestandteil)

    Ursache: Die Aktien-Auswertung (Korrelation, Signal-Precision, Aktien-Detail mit Trades,
    Attribution) hängt nur am regelbasierten Archiv-Index (IndexRule); metricindex.js:84 setzt
    state.name = null, daher bleibt sie bei Metrik-Indizes (z. B. „Fed Rates“) inaktiv.

    Umfang:

    1. Bestehende Werkzeuge (Korrelationstabelle Top 100, Signal-Precision, Aktien-Detail
    mit Chart und Trades) auch für Metrik-Indizes anbinden. Archiv-Indizes bleiben unverändert.

    2. Zeitlogik wie bisher, ohne Lookahead: Änderung von Tag T (vor US-Close) gepaart mit
    der Rendite von Close T bis Close am nächsten Handelstag; PIT-Prüfung (quality.pit) gilt
    weiter.

    3. Einheit des Gesamtindex sind z-Punkte: Steigung, Mindest-Veränderung (min_change) und
    Beschriftungen entsprechend umstellen.

    4. Zwei Regressionen nebeneinander:

    - Einfach: ΔIndex (z) → Rendite.

    - Mehrfach: Tagesänderung jeder Metrik in Roheinheit (z. B. bp) als eigener Regressor
    → Rendite; je Bestandteil Koeffizient und p-Wert, dazu gemeinsamer F-Test und R².

    - Warnhinweis bei stark korrelierten Bestandteilen (Multikollinearität, z. B. Korrelation
    der Regressoren bzw. VIF über Schwelle).

    - Ersetzt bei Metrik-Indizes die alte Markt-Attribution.

    5. Zielgröße umschaltbar: Überrendite gegenüber dem Markt (Voreinstellung) oder rohe Rendite;
    Markt = gleichgewichteter Schnitt der Top 100.

    6. Gesamtmarkt (Schnitt Top 100) als eigene, oberste Zeile ausgewertet, immer mit roher
    Rendite.

    7. Mehrfachtests: erwartete Zufallstreffer und Bonferroni-Schwelle wie bisher, auch für
    die Regression.

    8. Logging: jeder Aufruf (Index, Zeitraum, Zielgröße, Anzahl Tage/Aktien, signifikante
    Treffer) und jeder Klick (Zielgröße umschalten, Aktie öffnen) im app.log.

    Definition of Done:

    - „Fed Rates“ zeigt die Tabelle mit Gesamtmarkt-Zeile plus 100 Aktien.

    - Einfache und mehrfache Regression werden nebeneinander angezeigt, inklusive Koeffizienten,
    p-Werten, F-Test und R².

    - Schalter Überrendite/rohe Rendite funktioniert, Voreinstellung ist Überrendite.

    - Bei stark korrelierten Bestandteilen erscheint ein sichtbarer Warnhinweis.

    - Steigung und Mindest-Veränderung sind bei Metrik-Indizes in z-Punkten beschriftet und
    gerechnet.

    - Aktien-Detail mit Chart und Trades öffnet sich auch bei Metrik-Indizes.

    - Archiv-Indizes funktionieren exakt wie vorher.

    - Aufrufe und Klicks sind im app.log nachvollziehbar.

    - Requirements.log, Changelog.md aktualisiert; alle Tests grün, ohne Live-API-Aufrufe
    und ohne lokale Dateien.

    Testumfang:

    - Zeitlogik: Paare nutzen nur Index-/Metrikwerte bis Tag T und die Rendite Close T → Close
    nächster Handelstag; keine Paare über Datenlücken > MAX_GAP_DAYS.

    - Einfache Regression liefert auf synthetischen Daten mit bekannter Steigung den erwarteten
    Koeffizienten und p-Wert.

    - Mehrfache Regression liefert auf synthetischen Daten mit zwei bekannten Koeffizienten
    die erwarteten Werte, F-Test und R².

    - Multikollinearität: zwei nahezu identische Regressoren lösen den Warnhinweis aus, unabhängige
    nicht.

    - Überrendite: Aktie minus gleichgewichteter Top-100-Schnitt wird korrekt berechnet; Gesamtmarkt-Zeile
    nutzt rohe Rendite.

    - Bonferroni-Schwelle und erwartete Zufallstreffer stimmen mit der Anzahl getesteter Aktien
    überein.

    - Endpunkt für Metrik-Index gibt 200 mit vollständiger Struktur; unbekannter Index gibt
    404.

    - Regressionstest: Korrelations- und Attribution-Endpunkte der Archiv-Indizes liefern
    unveränderte Ergebnisse.

    - PIT: provisorische oder zukunftsdatierte Kurse und Snapshots fließen nicht ein.'
- id: disc-1015-2152-herkunft-der-sprunge-unklar
  name: Herkunft der Sprünge unklar
  thema: 'where are these jumps coming from? '
  model: Standard
  thinking: standard
  erstellt: 2026-10-15 21:52
  bild: .devconsole/discussions/418C38DD-192B-4BEE-AC86-99660B223BD2.png
  archiviert: 2026-10-15 21:57
  ergebnis: 'Ins Ticket übernommen: Index-Builder nur aus validierten Metriken (1015-2157-index-builder-nur-aus-validierte)

    Der Index-Builder bietet ausschließlich Metriken mit Status validated zur Auswahl an.
    Die bisherige Regel-Auswahl (Tags, Keywords, Liquiditätsfilter, Preis-Korridor) entfällt
    im Builder (ersetzt Requirements #4, #11, #25 → superseded).

    Ein Index besteht aus einer oder mehreren validierten Metriken mit Gewichten; Metriken
    unterschiedlicher Einheiten (bp, Wahrscheinlichkeit) werden für die Indexberechnung standardisiert.

    Wird eine Metrik eines bestehenden Index später gesperrt (blocked), rechnet der Index
    weiter, zeigt aber eine deutliche Warnung; neue Indizes mit dieser Metrik sind nicht möglich.

    Bestehende regelbasierte Indizes bleiben als „Archiv, nur lesbar“ erhalten (Wertentwicklung
    und Bestandteile sichtbar, nicht mehr bearbeitbar), nichts wird gelöscht.

    Index Manufacture (#17): Katalog und KI-Vorschläge bleiben; „Als Index veröffentlichen“
    wird zu „Als Metrik-Entwurf anlegen“ (Status draft).

    Definition of Done:

    - Builder zeigt in der Auswahl nur validierte Metriken; draft und blocked erscheinen nicht

    - Backend lehnt das Speichern eines Index mit nicht validierter Metrik mit 400/409 ab

    - Regel-Felder (Tags, Keywords, Liquidität, Preis-Korridor) sind aus dem Builder entfernt

    - Bestehende regelbasierte Indizes sind als Archiv sichtbar und nicht bearbeitbar

    - Index mit nachträglich gesperrter Metrik rechnet weiter und zeigt eine sichtbare Warnung

    - Index Manufacture legt statt eines Index einen Metrik-Entwurf (draft) an

    - Alle Auswahl-, Speicher- und Warnereignisse stehen in app.log

    - Requirements.log: #4, #11, #25 auf superseded mit Verweis, #17 angepasst; Changelog.md
    aktualisiert

    Testumfang:

    - Auswahl-Endpunkt des Builders liefert nur validierte Metriken

    - Speichern eines Index mit draft- oder blocked-Metrik wird abgelehnt

    - Index aus zwei validierten Metriken mit unterschiedlichen Einheiten liefert standardisierten
    Indexwert

    - Sperre einer Metrik → bestehender Index liefert weiter Werte plus Warnflag

    - Archiv-Index ist abrufbar, Bearbeiten (PUT) wird abgelehnt

    - Index Manufacture „Als Metrik-Entwurf anlegen“ erzeugt eine Metrik mit Status draft'
- id: disc-1015-2103-fed-zinsketten-abruf-schlagt-feh
  name: Fed-Zinsketten-Abruf schlägt fehl (HTTP 500)
  thema: '295 Märkte geprüft, 0 neu, 0 Tageswerte ergänzt, 295 fehlgeschlagen. Fed-Zinsketten
    fehlgeschlagen: coverage: HTTP 500'
  model: Standard
  thinking: standard
  erstellt: 2026-10-15 21:03
  archiviert: 2026-10-15 21:19
  ergebnis: 'Ins Ticket übernommen: Staging-Ordner und idempotenter Raw-Layer in SQLite (Pilot:
    Fed-Zinsketten) (1015-2119-staging-ordner-und-idempotenter)

    Auslöser: Beim Nachladen der Fed-Zinsketten scheitern alle 295 Märkte und /quality/fed/coverage
    liefert HTTP 500. Ursache laut app.log: In backend/dev.db fehlen fed_markets/fed_prices
    (Migration 0009 nie ausgeführt, kein automatisches Schema-Update). Der 500er erscheint
    nicht in app.log, weil unbehandelte Exceptions an der Request-Logging-Middleware vorbeilaufen.
    Der Loader ruft 173 s lang das Netz ab, bevor er beim Speichern scheitert.

    Neuer Aufbau der Datenladung, als Pilot für die Fed-Zinsketten (Kalshi + Polymarket):

    1. Abrufen -> Staging: API-Antworten werden unverändert als Dateien unter data/staging/<quelle>/<datensatz>/<datum>/
    abgelegt (inkl. Abrufzeitpunkt und URL). Dateien sind unveränderlich, werden nie überschrieben.
    Identischer Inhalt zur letzten Datei derselben Anfrage wird nicht erneut geschrieben.
    data/ ist gitignored.

    2. Staging -> Raw: Neue Staging-Dateien werden unverändert in Raw-Tabellen der lokalen
    SQLite-DB geladen (Inhalt, Quelle, Datensatz, Abrufzeit, Prüfsumme). Ein Ladeprotokoll
    hält fest, welche Dateien geladen sind.

    3. Idempotenz ist Kernanforderung: Unsere Ladeprozesse dürfen nie Duplikate in der DB
    erzeugen. Absicherung über Eindeutigkeitsregeln in der DB selbst (nicht nur Code-Prüfung),
    Einfügen überspringt Vorhandenes still. Identischer Inhalt wird einmal gespeichert (mit
    Zeitpunkt des ersten Abrufs), geänderter Inhalt ist eine neue Beobachtung und wird gespeichert.

    4. Beide Schritte getrennt als CLI-Befehl und als Button im Bereich Fed-Zinsketten; Schema
    wird vor dem Laden automatisch auf head migriert (auch in start_dev.sh vor dem Serverstart).

    5. Logging-Lücke schließen: Unbehandelte Fehler mit Status 500 und Traceback in app.log;
    API loggt beim Start den Schema-Stand, /health meldet veraltetes Schema; Frontend zeigt
    die Fehlermeldung des Servers statt nur "HTTP 500".

    Bestehende Tabellen fed_markets/fed_prices und die Fed-Sicht bleiben erhalten; deren Befüllung
    aus dem Raw-Layer sowie weitere Quellen (EUI-Snapshots, Aktienkurse, Backfill, Probe)
    und eine Spiegelung nach Neon sind eigene Folge-Tickets.

    Definition of Done:

    - Abruf schreibt API-Antworten unverändert nach data/staging/<quelle>/<datensatz>/<datum>/
    und überschreibt nie eine vorhandene Datei

    - Identischer Abruf erzeugt keine zweite Staging-Datei, geänderter Inhalt eine neue

    - data/ ist in .gitignore eingetragen

    - Ladeschritt bringt neue Staging-Dateien 1:1 in die Raw-Tabellen; ein zweiter Lauf lädt
    0 Dateien

    - Raw-Tabellen und Ladeprotokoll haben Eindeutigkeitsregeln auf ihrem fachlichen Schlüssel
    in der DB (Migration vorhanden)

    - Wiederholte und gleichzeitige Läufe ergeben exakt denselben Datenbestand ohne Duplikate

    - Abbruch mitten im Lauf hinterlässt keine halben Daten (pro Datei alles oder nichts);
    der nächste Lauf setzt sauber fort

    - Fehlerhafte Staging-Dateien werden protokolliert und übersprungen, der Lauf läuft weiter

    - Vor dem Laden und in start_dev.sh wird das DB-Schema automatisch auf den neuesten Stand
    gebracht; bestehende Daten in dev.db bleiben erhalten

    - Jeder Lauf loggt gefunden / neu / übersprungen / fehlgeschlagen

    - Unbehandelte Exceptions erscheinen in app.log mit Request-Zeile (Status 500) und Traceback

    - API loggt beim Start den Schema-Stand; /health meldet ein veraltetes Schema

    - Frontend zeigt bei Fehlern die Meldung des Servers statt nur "HTTP 500"

    - CLI-Befehle und Buttons für "Abrufen -> Staging" und "Staging -> Raw" vorhanden, Klicks
    werden geloggt

    - Bestehende Fed-Sicht (Abdeckung, Ketten, Prüfungen) funktioniert unverändert; alle bestehenden
    Tests grün

    - Changelog.md, Requirements.log und BugReports.yaml aktualisiert

    Testumfang:

    - Abruf mit simulierter Quelle schreibt die erwarteten Staging-Dateien mit unverändertem
    Inhalt, Abrufzeit und URL

    - Identischer Abruf zweimal: nur eine Staging-Datei; geänderter Inhalt: zwei Dateien

    - Laden auf leere DB legt das Schema'
- id: disc-1015-2000-warum-andern-sich-die-gewichte-i
  name: Warum ändern sich die Gewichte im Index?
  thema: 'Every time I look into the index, the weights have changed. Why is that? '
  model: Standard
  thinking: standard
  erstellt: 2026-10-15 20:00
  bild: .devconsole/discussions/096F8EF1-29B2-47EA-AD18-785387116F84.png
  archiviert: 2026-10-15 20:43
  ergebnis: 'Ins Ticket übernommen: Fed-Zinsketten: Raw-Layer, erwartete Zinsänderung als
    Front- und Zweitkette, Sicht in Datenqualität (1015-2043-fed-zinsketten-raw-layer-erwarte)

    Ziel: Zinsindex aus Prognosemärkten mit möglichst langer, sauberer Historie. Bestehende
    Indizes, Backfill, Korrelation und Datenqualitäts-Ansichten bleiben unverändert.


    1. Raw-Layer (eigene Tabellen, getrennt von eui_market_snapshots):

    - Alle Fed-Entscheidungsmärkte (FOMC) von Kalshi und Polymarket laden, auch abgeschlossene,
    so weit zurück wie die APIs Kurse liefern.

    - Pro Markt: Quelle, externe ID, Sitzungsdatum, Ausgang als Zinsschritt in bp (z. B. -50,
    -25, 0, +25), Titel, Link.

    - Pro Tag und Ausgang: Preis, Umsatz (falls verfügbar), Abrufzeitpunkt, Herkunft (live/historisch).

    - Append-only: Rohdaten werden nie überschrieben; erneuter Lauf lädt nur Fehlendes nach
    (idempotent).

    - Point-in-time-Regel wie bisher (quality.pit): kein Tageswert nach US-Börsenschluss des
    jeweiligen Tages.

    - Startbar per CLI und Endpoint; ein fehlerhafter Markt stoppt den Lauf nicht.


    2. Abgeleitete Metrik (Datenebene, aus dem Raw-Layer berechnet):

    - Pro Sitzung und Tag: Wahrscheinlichkeiten der Ausgänge auf 100 % normieren; erwartete
    Zinsänderung = Summe(Wahrscheinlichkeit × bp).

    - Wahrscheinlichkeitssumme vor Normierung mitspeichern (Qualitätsmerkmal).

    - Reihen getrennt für Kalshi, Polymarket und kombiniert (Mittelwert, wenn beide vorhanden).

    - Zwei Ketten: Front-Kette = jeweils nächste anstehende Sitzung; Zweitkette = jeweils
    übernächste Sitzung.

    - Nach jeder Entscheidung rollen beide Ketten eine Sitzung weiter (bisherige Zweit-Sitzung
    wird Front).

    - Am Roll-Tag wird die Tagesänderung nur innerhalb desselben Marktes gemessen (Kettenverknüpfung),
    der Wechsel erzeugt keinen Sprung.


    3. Sicht im Tab "Datenqualität" (neuer Abschnitt "Fed-Zinsketten"):

    - Abdeckung: Zeitbalken pro Sitzung und Quelle, Lücken markiert.

    - Kettenverlauf: Chart von Front- und Zweitkette je Quelle, Roll-Tage markiert.

    - Prüfungen: Wahrscheinlichkeitssumme deutlich ungleich 100 %, fehlende Tage, Abweichung
    Kalshi vs. Polymarket, Tagessprünge, Werte nach Börsenschluss.

    - Drill-down: Klick auf einen Tag zeigt die Rohwerte je Ausgang, aus denen der Wert entstand.


    4. Logging: Laden (Start, Ende, Anzahl Märkte/Zeilen, Fehler je Markt), Berechnung, Roll-Ereignisse,
    Prüfergebnisse sowie alle Klicks und Eingaben in der neuen Sicht.


    Nicht enthalten: Anbindung an die Aktienkorrelation (Folgeticket, sobald die Datenqualität
    überzeugt).

    Definition of Done:

    - Raw-Tabellen existieren per Alembic-Migration und enthalten Fed-Märkte beider Quellen
    inklusive abgeschlossener Sitzungen.

    - Zweiter Ladelauf ohne neue Daten fügt 0 Zeilen hinzu und ändert keine bestehende Zeile.

    - Keine Raw-Zeile hat einen Beobachtungszeitpunkt nach dem US-Börsenschluss ihres Tages.

    - Für jeden Tag mit Daten liegen erwartete Zinsänderung, Rohsumme der Wahrscheinlichkeiten
    und Quelle je Sitzung vor.

    - Front- und Zweitkette sind für jeden Tag mit Daten berechnet; Roll-Tage sind gekennzeichnet.

    - Am Roll-Tag entspricht die Tagesänderung der Kette der Änderung des neuen Front-Marktes
    gegenüber seinem eigenen Vortageswert.

    - Tab "Datenqualität" zeigt Abdeckung, Kettenverlauf beider Ketten, Prüfungen und Drill-down
    auf Rohwerte.

    - Bestehende Indizes, Backfill, Korrelation und bisherige Datenqualitäts-Ansichten funktionieren
    unverändert (bestehende Tests grün).

    - Logging für Laden, Berechnung, Rollen, Prüfungen und UI-Klicks ist vorhanden.

    - Alle Dateien unter 500 Zeilen; Changelog.md und Requirements.log sind aktualisiert.

    Testumfang:

    - Parser Kalshi: Fed-Markt-Antwort (Fixture) wird korrekt in Sitzungsdatum, Ausgang in
    bp und Tagespreise zerlegt.

    - Parser Polymarket: Fed-Event mit mehreren Ausgängen (Fixture) wird korrekt in Ausgänge
    mit bp und Tagespreise zerlegt.

    - Idempotenz: zweiter Ladelauf mit denselben Fixture-Daten fügt keine Zeilen hinzu und
    überschreibt nichts.

    - Point-in-time: Kurspunkt nach US-Börsenschluss wird verworfen.

    - Fehlertoleranz'
