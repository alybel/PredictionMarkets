  ergebnis: 'Ins Ticket übernommen: Leere Aktien-Detailansicht beheben (Namenskonflikt fmtShare)
    + JS-Fehler-Logging (bug-1015-1316-leere-aktien-detailansicht-beheb)

    Klick auf eine Aktie in der Aktien-Korrelation zeigt nur den Ticker; Kennzahlen, Charts,
    Robustheit, Attribution und Trades bleiben leer, es geht keine Anfrage ans Backend. Ursache:
    attribution.js:7 und correlation.js:13 deklarieren beide top-level `const fmtShare`; der
    Browser verwirft daher attribution.js komplett, loadTrades() bricht in trades.js:32 bei
    loadAttribution(...) ab. Der Fehler erscheint nicht im App-Log.

    Umfang:

    1. Hilfsfunktion in attribution.js umbenennen (z. B. fmtContribution); Format „+0,123“
    bleibt unverändert.

