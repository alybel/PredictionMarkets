    - Negativfall: ein Testmodul mit HTTP-Import außerhalb der Rohdatenschicht wird als Verstoß
    erkannt.'
- id: disc-1017-1021-gap-analyse-marktbasierter-risik
  name: 'Gap-Analyse: Marktbasierter Risiko-Index (Pipeline 1–5)'
