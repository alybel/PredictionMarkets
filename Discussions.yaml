- id: disc-1015-1156-pro-komponente-performance-beitr
  name: Pro Komponente Performance-Beitrag pro Aktie anzeigen
  thema: wir haben nun sehr viele Komponenten im Index. Ich möchte pro Komponente den Beitrag
    zur Performance bei einer Aktie sehen. Wie würden wir das machen?
  model: Standard
  thinking: standard
  erstellt: 2026-10-15 11:56
  bild: .devconsole/discussions/C044BB52-2DE8-4593-9D0B-BAC203312C6A.png
  archiviert: 2026-10-15 12:00
  ergebnis: 'Ins Ticket übernommen: Performance Attribution je Komponente für eine Aktie (1015-1200-performance-attribution-je-kompo)

    In der Aktien-Detailansicht wird angezeigt, welche Komponenten des Index den Zusammenhang
    „Index-Veränderung → Rendite der Aktie am nächsten Tag" tragen.

    Die Index-Veränderung ΔI je Tag wird exakt auf die Komponenten zerlegt (Index = Σ Gewicht
    × Preis, Gewicht = 24h-Umsatz-Anteil), jeweils getrennt in Preiseffekt (Gewicht gestern
    × Preisänderung) und Gewichtseffekt (Gewichtsänderung × Preis heute; Umschichtung inkl.
    Ein- und Austritte).

    Darauf aufbauend werden Korrelation und Beta der Haupttabelle exakt additiv auf die Komponenten
    verteilt (Kovarianz-Zerlegung wie bei einer Risiko-Attribution), ebenfalls getrennt nach
    Preis- und Gewichtseffekt.

    Nur Gesamtsicht über den betrachteten Zeitraum, keine Aufschlüsselung je Tag. Keine Benchmark-Attribution
    (Brinson gegen Vergleichsindex), keine p-Werte je Komponente.

    Berechnung ausschließlich auf vorhandenen Daten (Markt-Snapshots, Aktienkurse), ohne KI-Aufruf
    und ohne neue Datenbanktabelle. Erweitert Anforderungen Nr. 26 und Nr. 28.

    Definition of Done:

    - Die Aktien-Detailansicht hat einen Abschnitt „Beitrag je Komponente" mit je Markt: Tage
    im Index, Ø Gewicht, Anteil an der Korrelation, Anteil am Beta (jeweils getrennt nach
    Preis- und Gewichtseffekt) und eigene Korrelation.

    - Die Summe aller Anteile entspricht exakt (Toleranz 1e-9) der Korrelation bzw. dem Beta
    der Haupttabelle für dieselbe Aktie.

    - Angezeigt werden die Top 20 Komponenten nach Betrag des Anteils, eine Zeile „Übrige"
    und eine Summenzeile.

    - Ein Hinweistext erklärt, dass bei wenigen Index-Tagen der Zufall eine große Rolle spielt;
    es werden keine p-Werte je Komponente angezeigt.

    - Mindest-Ausschlag (min_change) und Lückenregel (max. 5 Tage) gelten identisch zur Haupttabelle.

    - Funktioniert für gespeicherte Indizes und für ungespeicherte Index-Entwürfe (Vorschau,
    DB unverändert).

    - Jeder Aufruf wird geloggt (Index, Aktie, Anzahl Komponenten, Dauer).

    - Bestehende Funktionen (Korrelationstabelle, Aktien-Detailansicht, Trades) bleiben unverändert
    erhalten.

    Testumfang:

    - Preiseffekt plus Gewichtseffekt aller Komponenten ergeben je Tag exakt ΔI, auch bei
    Ein- und Austritten von Märkten.

    - Die Anteile an Korrelation und Beta ergeben in Summe den Gesamtwert der Haupttabelle.

    - Bei konstanten Gewichten ist der Gewichtseffekt 0.

    - Ein neu in den Index aufgenommener Markt landet am Eintrittstag vollständig im Gewichtseffekt.

    - Ein Index mit nur einer Komponente ergibt 100 % Anteil für diese Komponente.

    - Randfall: weniger als 10 Beobachtungen liefert keine Anteile (wie Haupttabelle), ohne
    Fehler.

    - Randfall: Aktie ohne Kursdaten liefert leeres Ergebnis ohne Fehler.

    - Randfall: Komponente an nur einem Tag im Index wird korrekt berücksichtigt.

    - Top-20-Kappung: Zeile „Übrige" enthält die Summe aller restlichen Anteile.

    - API-Test für gespeicherten Index und für die Vorschau mit ungespeicherter Regel.

    - Bestehende Korrelationstests bleiben grün; keine Live-API-Aufrufe in Tests.'
- id: disc-1015-1126-bug-in-southern-company-analysie
  name: Bug in Southern Company analysieren
  thema: "I assume here is a bug in Souther Company, analyze this \n"
  model: Standard
  thinking: standard
  erstellt: 2026-10-15 11:26
  bild: .devconsole/discussions/91F9BA50-2705-4F09-9919-B36C1BF6A141.png
  archiviert: 2026-10-15 11:57
  ergebnis: 'Ins Ticket übernommen: Signal-Precision mit Schwellenwert in der Korrelations-Übersicht
    (1015-1157-signal-precision-mit-schwellenwe)

    Anlass: Bei Southern Company wurde ein Bug vermutet. Die Analyse ergab keinen Rechenfehler:
    Der kleine p-Wert kommt von der Stärke der (negativen) Korrelation, nicht von der Trefferquote.
    Gewünscht ist zusätzlich eine Accuracy mit Threshold, die misst, wie oft ein Index-Signal
    am nächsten Handelstag eine Aktienbewegung über einer Schwelle in der erwarteten Richtung
    auslöst und ob das besser als Zufall ist.


    Umfang:

    - Neues Feld „Mindest-Aktienbewegung“ (Standard 1 %) in der Korrelations-Karte neben „Mindest-Veränderung“;
    wird wie die bestehenden Einstellungen in localStorage gespeichert und als Query-Parameter
    an GET /indices/{name}/correlation und POST .../correlation/preview übergeben.

    - Signal = Handelstag T mit |ΔI_T| > Mindest-Veränderung (bestehende Logik). Treffer =
    Rendite am nächsten Tag (bestehende Timing-Logik, kein Look-ahead) über der Mindest-Aktienbewegung
    in der erwarteten Richtung.

    - Richtung ohne Selbstbetrug: Die erwartete Richtung (mit oder gegen den Index) wird pro
    Aktie aus der ersten Hälfte der Signal-Tage bestimmt (Vorzeichen der Korrelation dort).
    Alle neuen Kennzahlen werden nur auf der zweiten Hälfte gemessen (Aufteilung 50/50, chronologisch).

    - Beide Index-Richtungen werden in der Übersicht zusammengefasst (Anstieg → erwartete
    Richtung, Rückgang → Gegenrichtung).

    - Neue Spalten pro Aktie: Signale (Anzahl im Testteil), Precision (Treffer ÷ Signale),
    Basisrate (Anteil aller Testtage, an denen die Aktie ohnehin über der Schwelle in die
    jeweils erwartete Richtung ging), Lift (Precision ÷ Basisrate), p (Signal) als einseitiger
    Binomialtest der Treffer gegen die Basisrate.

    - Unter 15 Signalen im Testteil zeigt die Zeile „zu wenig Daten“ statt Precision, Lift
    und p.

    - Eigene Markierung, wenn p (Signal) unter der Bonferroni-Schwelle (0,05 ÷ getestete Aktien)
    liegt.

    - Die neuen Spalten sind sortierbar wie die bestehenden.

    - Detailansicht (Klick auf eine Aktie): Robustheits-Matrix mit der Precision und Signal-Anzahl
    für Index-Schwelle 0,5 / 1 / 2 Punkte × Aktien-Schwelle 0,5 / 1 / 2 %, dazu ein Hinweis,
    dass die beste Zelle nicht nachträglich ausgewählt werden darf.

    - Nebenbei: Bei der Trefferquote „(40 von 61)“ statt „(40)“ anzeigen. Bei negativer Korrelation
    zusätzlich die Gegenquote zeigen (z. B. „38 % · gegenläufig 62 %“).

    - Logging: Änderung der Mindest-Aktienbewegung (Frontend-Event), pro Korrelationslauf
    die Gesamtzahl der Signale und die Zahl der Aktien unter der Mindestzahl an Signalen (Backend).

    - Bestehende Spalten, Kennzahlen und API-Felder bleiben unverändert; die neuen Felder
    kommen nur hinzu.

    Definition of Done:

    - Die Korrelations-Übersicht zeigt die Spalten Signale, Precision, Basisrate, Lift und
    p (Signal) für jede getestete Aktie.

    - Das Feld „Mindest-Aktienbewegung“ ist vorhanden, steht standardmäßig auf 1 %, wird gespeichert
    und löst bei Änderung eine Neuberechnung aus.

    - Die erwartete Richtung wird nur aus der ersten Hälfte bestimmt, die Kennzahlen nur auf
    der zweiten Hälfte berechnet.

    - Bei weniger als 15 Signalen im Testteil steht „zu wenig Daten“.

    - Liegt p (Signal) unter der Bonferroni-Schwelle, ist das sichtbar markiert.

    - Die Detailansicht einer Aktie zeigt die 3×3-Robustheits-Matrix mit Precision und Signal-Anzahl
    samt Hinweistext.

    - Die Trefferquote zeigt „(Ereignisse von n)“, bei negativer Korrelation zusätzlich die
    Gegenquote.

    - Änderungen der Schwelle und die Signal-Zahlen pro Lauf erscheinen im Log.

    - Alle bestehenden Tests sind grün, bestehende Felder der Correlation-API sind unverändert.

    - Changelog.md und Requirements.log sind aktualisiert.

    Testumfang:

    - Precision, Basisrate und Lift auf festen Beispieldaten entsprechen den von Hand nachgerechneten
    Werten.

    - Binomialtest liefert für bekannte Fälle den erwarteten p-Wert (z. B. 25 von 40 bei Basisrate
    0,5 → einseitig ≈ 0,077).

    - Zeitaufteilung: Die Richtung wird nur aus der ersten Hälfte bestimmt;'
- id: disc-0922-1729-eingesetzte-technologien-klaren
  name: Eingesetzte Technologien klären
  thema: 'what technology are we using in this website? '
  model: Standard
  thinking: standard
  erstellt: 2026-09-22 17:29
  archiviert: 2026-09-22 17:37
  ergebnis: 'Ins Ticket übernommen: Durchgaengiges Logging fuer Frontend und Backend (0922-1737-durchgaengiges-logging-fuer-fron)

    Die Anwendung erhaelt ein einheitliches, nachvollziehbares Logging. Heute existiert lediglich
    ein einzelner Logger in backend/app/clients/base.py.

    Backend: zentrale Logging-Konfiguration mit Ausgabe in eine Logdatei und auf die Konsole,
    einheitliches Format mit Zeitstempel und Stufe. Protokolliert werden Start und Stopp der
    Anwendung, jeder API-Aufruf mit Pfad, Methode, Statuscode und Dauer, jeder Abruf der Marktdatenquellen
    inklusive Trefferzahl und Fehlern, Treffer und Verfehlen des Markt-Caches sowie jede schreibende
    Aenderung an Index-Regeln (Anlegen, Aendern, Loeschen).

    Frontend: ein Logger, der Index-Wechsel, Parameter-Aenderungen, Speichern, Verwerfen,
    Loeschen, Anlegen, Aktualisieren, Filter- und Sortierwechsel sowie aufgetretene Fehler
    erfasst. Die Eintraege werden gebuendelt an einen neuen Endpunkt POST /logs gesendet und
    dort in dieselbe Logdatei geschrieben, damit alles an einer Stelle zusammenlaeuft. Das
    Senden darf die Bedienung nicht blockieren; faellt der Endpunkt aus, arbeitet die Oberflaeche
    normal weiter.

    Keine personenbezogenen Daten und keine Zugangsdaten im Log.

    Definition of Done:

    - Eine zentrale Logging-Konfiguration schreibt in eine Logdatei und auf die Konsole, mit
    Zeitstempel und Stufe je Zeile

    - Start und Stopp der Anwendung erzeugen je einen Logeintrag

    - Jeder API-Aufruf wird mit Methode, Pfad, Statuscode und Dauer protokolliert

    - Abrufe bei Polymarket und Kalshi werden mit Trefferzahl protokolliert, Fehler mit Stufe
    Warnung oder Fehler

    - Treffer und Verfehlen des Markt-Caches sind im Log unterscheidbar

    - Anlegen, Aendern und Loeschen einer Index-Regel erzeugen je einen Eintrag mit dem betroffenen
    Namen

    - Der Endpunkt POST /logs nimmt gebuendelte Frontend-Eintraege entgegen und schreibt sie
    in dieselbe Logdatei

    - Das Frontend protokolliert Index-Wechsel, Parameter-Aenderungen, Speichern, Verwerfen,
    Loeschen, Anlegen, Aktualisieren, Filter- und Sortierwechsel sowie Fehler

    - Ein Ausfall des Log-Endpunkts beeintraechtigt keine Funktion der Oberflaeche

    - Logs enthalten keine Zugangsdaten und keine personenbezogenen Daten

    Testumfang:

    - Backend-Test: Ein Aufruf von GET /indices erzeugt einen Logeintrag mit Methode, Pfad
    und Statuscode

    - Backend-Test: POST /logs mit einer Liste von Eintraegen antwortet mit Erfolg und schreibt
    jeden Eintrag ins Log

    - Backend-Test: POST /logs mit fehlerhaftem Rumpf wird mit Statuscode 422 abgewiesen

    - Backend-Test: Ein Fehler beim Abruf einer Marktquelle erzeugt einen Eintrag der Stufe
    Warnung, ohne den Abruf des Index abzubrechen

    - Backend-Test: Zwei aufeinanderfolgende Abrufe erzeugen einen Cache-Verfehlt- und einen
    Cache-Treffer-Eintrag

    - Backend-Test: PUT und DELETE auf eine Index-Regel erzeugen je einen Eintrag mit dem
    Regelnamen

    - Frontend-Test: Ein Index-Wechsel erzeugt einen Logeintrag im Puffer

    - Frontend-Test: Gepufferte Eintraege werden gebuendelt an POST /logs gesendet

    - Frontend-Test: Schlaegt POST /logs fehl, bleibt die Oberflaeche bedienbar und es erscheint
    keine Fehlermeldung fuer den Nutzer'
- id: disc-0919-1621-metriken-erweitern
  name: Metriken erweitern
  thema: 'Hier sind nur wenige Metriken drin, wie können wir erweitern? '
  model: Standard
  thinking: standard
  erstellt: 2026-09-19 16:21
  bild: .devconsole/discussions/F1C26596-0B7D-4B92-801C-A76052C156DA.png
  archiviert: 2026-09-19 16:29
  ergebnis: 'Ins Ticket übernommen: Index-Parameter im Frontend anpassen, Vorschau/Speichern,
    Indizes anlegen und löschen (0919-1629-index-parameter-im-frontend-anpa)

    Pro Index sollen die Parameter (Keywords, Tags/Kategorien, Mindestliquidität, Preis-Korridor)
    direkt im Dashboard anpassbar sein. Änderungen wirken zunächst nur als Vorschau (temporär
    ausprobieren, DB unverändert) und können auf Wunsch dauerhaft gespeichert werden. Zusätzlich
    sollen neue Indizes angelegt und bestehende gelöscht werden können.

    Beschlossener Umfang:

    - Neue Endpoints: Vorschau (Regel im Request-Body, berechnet Index-Wert, Trichter und
    Märkte ohne zu speichern), PUT /indices/{name} (Regel speichern), POST /indices (Index
    anlegen), DELETE /indices/{name} (Index löschen). Validierung: Name eindeutig, min_liquidity
    >= 10 000 USD, 0 <= min_price < max_price <= 1.

    - Dashboard: aufklappbares Panel "Parameter" pro Index mit Keyword-Chips (hinzufügen/entfernen),
    Tag-Mehrfachauswahl (Liste aus den tatsächlich gelieferten Tags der Grundgesamtheit),
    Eingaben für Mindestliquidität (Hinweis: mindestens 10 000 USD) und Preis-Korridor.

    - Jede Änderung im Panel löst sofort eine Vorschau aus: Kopfzeile, Trichter und Tabelle
    aktualisieren sich; die gespeicherte Regel bleibt unverändert. Markierung "ungespeicherte
    Änderungen".

    - Knöpfe "Dauerhaft speichern" (PUT, Markierung verschwindet) und "Verwerfen" (zurück
    zur gespeicherten Regel).

    - Knopf "Neuer Index": Name plus Parameter, wird nach Anlegen ausgewählt. Knopf "Index
    löschen" mit Rückfrage; danach wird der erste verbleibende Index ausgewählt.

    - Bestehende Funktionalität (Index-Auswahl, Tabelle, Quellenfilter, Titelfilter, Aktualisieren)
    bleibt erhalten.

    Definition of Done:

    - Vorschau-Endpoint liefert dieselbe Antwortstruktur wie GET /indices/{name}, ohne die
    Regel in der DB zu verändern.

    - PUT/POST/DELETE funktionieren mit Validierung (400 bei ungültigen Werten, 404 bei unbekanntem
    Index, 409 bei doppeltem Namen).

    - Panel zeigt die gespeicherten Parameter, Änderungen lösen eine Vorschau aus, Markierung
    für ungespeicherte Änderungen sichtbar.

    - Speichern persistiert; nach Neuladen der Seite sind die Werte vorhanden. Verwerfen stellt
    die gespeicherte Regel wieder her.

    - Index anlegen und löschen funktionieren aus dem Dashboard; gelöschte Indizes kehren
    nach Neustart nicht zurück.

    - Alle Dateien unter 500 Zeilen; Changelog.md und Requirements.log aktualisiert.

    Testumfang:

    - Vorschau mit geänderten Keywords liefert andere Marktauswahl; anschließendes GET /indices
    zeigt die unveränderte Regel.

    - PUT mit gültigen Werten speichert; GET /indices spiegelt die neuen Werte.

    - PUT mit min_liquidity 500 -> 400; PUT mit min_price >= max_price -> 400; PUT auf unbekannten
    Index -> 404.

    - POST mit neuem Namen legt Index an; POST mit vorhandenem Namen -> 409.

    - DELETE entfernt Index; anschließendes GET /indices/{name} -> 404.

    - Frontend-Logik (falls testbar ohne Browser): Zustand "ungespeichert" wird nach Speichern
    zurückgesetzt, nach Verwerfen die gespeicherte Regel wiederhergestellt.

    - Keine Live-API-Aufrufe in Tests.'
- id: disc-0918-2022-index-definition-in-der-app
  name: Index-Definition in der App
  thema: wie können wir gut einen Index definieren in der App
  model: Fable
  thinking: standard
  erstellt: 2026-09-18 20:22
  bild: .devconsole/discussions/CB2D6A1F-A9F6-4B3A-8796-BAB08705A6EB.png
  archiviert: 2026-09-19 16:30
  ergebnis: 'Worum es ging: Wie Prediction-Markets semantisch und weltgeschehen-adaptiv einem
    Index zugeordnet werden können.

    Stand:

    - Charter statt Keywords: jeder Index bekommt eine Prosa-Beschreibung; Keywords bleiben
    nur als billiger Vorfilter/Fallback.

    - Lokale Embeddings (sentence-transformers), einmal pro neuem Markt berechnet und gecacht;
