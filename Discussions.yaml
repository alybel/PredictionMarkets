  ergebnis: 'Ins Ticket übernommen: Architektur-Test: externe API-Aufrufe nur in der Rohdatenschicht
    (1017-1426-architektur-test-externe-api-auf)

    Ein automatischer Test sichert die Layered Architecture ab: Außerhalb der Rohdatenschicht
    darf kein Code externe APIs aufrufen (z. B. requests, httpx, urllib).

    Der Test läuft in CI auf einem frischen Clone ohne lokale Dateien.

    Definition of Done:

    - Der Architektur-Test ist Teil der Test-Suite und grün.

    - Ein absichtlich eingefügter HTTP-Aufruf in einem Businessprozess lässt den Test fehlschlagen.

    - Der Test braucht weder Netzwerk noch lokale Konfiguration.

    Testumfang:

